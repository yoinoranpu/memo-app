name: Windows preview installer
on:
  push:
    branches: [codex/publication-safety-improvements]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build preview installer
        shell: pwsh
        run: |
          cmd /c "npm run dist -- --publish never > windows-build.log 2>&1"
          $previewBuildExit = $LASTEXITCODE
          Get-Content windows-build.log | Write-Output
          if ($previewBuildExit -ne 0) {
            $failureLines = Get-Content windows-build.log | Select-String -Pattern 'error|failed|cannot|not found|ENOENT|⨯' | Select-Object -Last 12
            foreach ($line in $failureLines) {
              $annotation = $line.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows installer::$annotation"
            }
            exit $previewBuildExit
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: memo-app-windows-preview
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
